{{- if eq (include "metacat.ingress.type" .) "traefik"}}
{{- if .Values.ingress.ipAllowList }}
##
## This file contains "ipAllowList" middleware definitions for Traefik.
##
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-ip-allowlist
  namespace: {{ .Release.Namespace }}
spec:
  ipAllowList:
    sourceRange:
    {{- range .Values.ingress.ipAllowList }}
      - {{ . }}
    {{- end }}
{{- end }}
{{- end }}
