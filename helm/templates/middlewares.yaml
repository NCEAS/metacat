{{- if eq (include "metacat.ingress.type" .) "traefik"}}
{{- $mtlsEnabled := index .Values.metacat "dataone.certificate.fromHttpHeader.enabled" -}}
{{- $siteMapEnabled := index .Values.metacat "sitemap.enabled" }}
## Only one middleware can be added to the ingress annotations. This middleware "chain" definition
## chains together the other Traefik Middlewares below, so only this one needs to be referenced
## in the ingress annotations.
##
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-middlewares
  namespace: {{ .Release.Namespace }}
spec:
  chain:
    middlewares:
    {{- if $siteMapEnabled }}
      - name: {{ .Release.Name }}-sitemap-redirect
    {{- end }}
      - name: {{ .Release.Name }}-robots-redirect
    {{- range .Values.ingress.rewriteRules }}
      - name: {{ $.Release.Name }}-{{ .name }}
    {{- end }}
    {{- if $mtlsEnabled }}
      - name: {{ .Release.Name }}-passcert
      - name: {{ .Release.Name }}-customheaders
    {{- end }}

{{- if $siteMapEnabled }}
---
# Source: metacat/templates/middlewares.yaml
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-sitemap-redirect
spec:
  redirectRegex:
    regex: "^https?://([^/]+)/robots.txt"
    replacement: "https://${1}/metacat/robots.txt"
    permanent: false
{{- end }}

---
# Source: metacat/templates/middlewares.yaml
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-robots-redirect
spec:
  redirectRegex:
    regex: "^https?://[^/]+/robots.txt"
    replacement: "https://${host}/metacat/robots.txt"
    permanent: false

{{- range .Values.ingress.rewriteRules }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
spec:
  redirectRegex:
    regex: {{ .regex | quote }}
    replacement: {{ .replacement | quote }}
    permanent: {{ default "false" .permanent }}
{{- end }}

{{- if $mtlsEnabled }}
---
## Traefik equivalent to Nginx:
## nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"
##
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-passcert
  namespace: {{ .Release.Namespace }}
spec:
  passTLSClientCert:
    pem: true
    info:
      subject:
        country: true
        province: true
        locality: true
        organization: true
        organizationalUnit: true
        commonName: true
        serialNumber: true
        domainComponent: true
---
## Traefik equivalent to Nginx:
## nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"
##
{{- $apiVer := "v1" -}}
{{- $xProxyKeyKey := "METACAT_DATAONE_CERT_FROM_HTTP_HEADER_PROXY_KEY" -}}
{{- $secrets := (printf "%s-metacat-secrets" .Release.Name) -}}
{{- $secretData := (lookup $apiVer "Secret" .Release.Namespace $secrets).data | default dict -}}
{{- $xProxyKeyVal := ((get $secretData $xProxyKeyKey) | b64dec)
    | default (printf "SECRETS: '%s'; KEY NOT FOUND: '%s'" $secrets $xProxyKeyKey) }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-customheaders
  namespace: {{ .Release.Namespace }}
spec:
  headers:
    customRequestHeaders:
      X-Proxy-Key: {{ $xProxyKeyVal | quote }}
      Server: traefik
      Ssl-Client-Verify: ""          # overwrite to prevent client setting
      Ssl-Client-Subject-Dn: ""      # overwrite to prevent client setting
{{- end }}
{{- end }}
