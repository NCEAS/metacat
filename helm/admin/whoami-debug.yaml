## Deploy a lightweight container that echoes back the details of every
## request it receives from the ingress (including all headers).
##
## Deploy using 'kubectl apply -f whoami-debug.yaml', and then
## update Ingress to point to this service:
##  (Make sure you're updating the correct path/route!)
##
##    backend:
##      service:
##        name: whoami
##        port:
##          number: 80
##
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
      - name: whoami
        image: traefik/whoami
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: whoami
