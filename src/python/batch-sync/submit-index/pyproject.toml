[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dataone-index-submit"
version = "0.1.0"
description = "Tools for auditing Metacat's search index and submitting index tasks to RabbitMQ"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-2.0-only" }
dependencies = [
    "pika>=1.3",
    "requests",  # used by find_objects_to_reindex.py
]

[dependency-groups]
# Installed by default by `uv sync`. With pip (>= 25.1): pip install -e . --group dev
dev = ["pytest>=7"]

[tool.setuptools]
# Flat layout for now: the scripts stay deployable as single files (see README).
py-modules = ["submit_index_task_to_rabbitmq", "find_objects_to_reindex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs a running RabbitMQ broker (none exist yet)",
]
# Fail on deprecations triggered by our own scripts; third-party warnings are left alone.
filterwarnings = [
    "error::DeprecationWarning:submit_index_task_to_rabbitmq",
    "error::DeprecationWarning:find_objects_to_reindex",
]
